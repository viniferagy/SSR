[project]
name = "ssr"
version = "0.1.0"
description = "Self-contained pipeline for SSR reverse chain-of-thought generation and anchoring analysis."
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=3.6.0",
    "huggingface-hub>=0.36.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "safetensors>=0.7.0",
    "seaborn>=0.13.2",
    "torch==2.6.0",
    "tqdm>=4.66.0",
    "transformers>=4.57.0,<5",
]

[project.optional-dependencies]
generation = [
    "vllm>=0.8.0",
]

[tool.uv]
python-preference = "managed"
